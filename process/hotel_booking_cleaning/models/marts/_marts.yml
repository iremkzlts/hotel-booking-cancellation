version: 2

models:
  - name: fct_bookings
    description: >
      Her satir bir otel rezervasyonu. int_hotel_bookings_flagged tablosunu okur,
      stg_weather ile varis gunu ve otele gore birlestirir; gece sayisi, misafir
      sayisi, gelir ve hava durumu bilgilerini ekler. Dashboard'un ve Bolum 2'deki
      modelin ana tablosudur. Kopya satirlar silinmez, is_duplicate ile isaretlidir.
    columns:
      - name: booking_id
        description: Rezervasyonun benzersiz kimligi (staging'de uretilir).
        data_tests:
          - unique
          - not_null
      - name: hotel
        description: Otel turu. Resort Hotel (Algarve) veya City Hotel (Lizbon).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Resort Hotel', 'City Hotel']
      - name: city
        description: Hava durumu eslesmesi icin sehir. Resort Hotel -> Faro, City Hotel -> Lisbon.
        data_tests:
          - not_null
      - name: arrival_date
        description: Planlanan varis tarihi.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: is_canceled
        description: Hedef degisken. 1 = rezervasyon iptal edildi, 0 = edilmedi.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_duplicate
        description: >
          Esma'nin ara katmanindan gelen kopya isareti. Ayni bilgilere sahip ikinci ve
          sonraki satirlar true. Veri setinde rezervasyon numarasi olmadigi icin bunlar
          gercek ayri rezervasyonlar da olabilir; bu yuzden silinmedi.
        data_tests:
          - not_null
      - name: total_nights
        description: Toplam konaklama gecesi (hafta sonu + hafta ici).
      - name: total_guests
        description: Toplam misafir (yetiskin + cocuk + bebek).
      - name: is_room_changed
        description: Verilen oda tipi, rezerve edilenden farkli mi.
      - name: adr
        description: Ortalama gecelik fiyat (Average Daily Rate), Euro (varsayim, veri setinde belirtilmemis).
      - name: booking_revenue
        description: Rezervasyonun toplam tutari = adr x total_nights.
        data_tests:
          - not_null
      - name: realized_revenue
        description: Iptal edilmeyen rezervasyonlarda gerceklesen gelir, iptallerde 0.
      - name: lost_revenue
        description: Iptal edilen rezervasyonlarda kaybedilen gelir, digerlerinde 0.
      - name: temp_mean_c
        description: >
          Varis gunu ortalama sicaklik (C), Open-Meteo. DIKKAT: rezervasyon yapilirken bu
          bilgi henuz bilinmez; Bolum 2'de modelde kullanilacaksa bu sinirlilik belirtilmeli.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: precipitation_mm
        description: Varis gunu toplam yagis (mm).
      - name: is_rainy_day
        description: Varis gunu yagis 1 mm veya ustu ise true (meteorolojide yagisli gun esigi).
      - name: temp_band
        description: Varis gunu ortalama sicaklik araligi (15 alti, 15-20, 20-25, 25 ve ustu).
      - name: airport_icao
        description: Otelin havalimani. Resort Hotel -> LPFR (Faro), City Hotel -> LPPT (Lizbon).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LPFR', 'LPPT']
      - name: airport_arrivals
        description: Varis gunu havalimanina inen IFR ucus sayisi (Eurocontrol).
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: atfm_arrival_delay_min
        description: Varis gunu havalimani ATFM varis gecikmesi (dakika). Bos ise o gun gecikme kaydi yok.
      - name: atfm_weather_delay_min
        description: Bu gecikmenin hava durumu (W kodu) kaynakli kismi (dakika).
      - name: atfm_delay_per_arrival_min
        description: Ucus basina ortalama ATFM gecikmesi (dakika). Bos gecikme 0 kabul edilir.
      - name: is_atfm_delay_day
        description: >
          Varis gunu havalimaninda ATFM gecikmesi var mi. DIKKAT: rezervasyon yapilirken
          bu bilgi henuz bilinmez; hava durumu sutunlariyla ayni sinirlilik gecerlidir.
      - name: reservation_status
        description: >
          Rezervasyonun son durumu (Canceled, No-Show, Check-Out). DIKKAT: iptal
          bilgisini dogrudan icerir, modelde girdi olarak KULLANILMAMALIDIR (veri sizintisi).
      - name: reservation_status_date
        description: Son durumun tarihi. reservation_status ile ayni sebeple modelde kullanilmaz.