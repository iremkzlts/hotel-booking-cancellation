version: 2

models:
  - name: fct_bookings
    description: >
      Her satir bir otel rezervasyonu. int_hotel_bookings_flagged tablosunu okur,
      stg_weather ile varis gunu ve otele gore birlestirir; gece sayisi, misafir
      sayisi, gelir ve hava durumu bilgilerini ekler. Dashboard'un ve Bolum 2'deki
      modelin ana tablosudur. Kopya satirlar silinmez, is_duplicate ile isaretlidir.
    columns:
      - name: booking_id
        description: Rezervasyonun benzersiz kimligi (staging'de uretilir).
        data_tests:
          - unique
          - not_null
      - name: hotel
        description: Otel turu. Resort Hotel (Algarve) veya City Hotel (Lizbon).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Resort Hotel', 'City Hotel']
      - name: city
        description: Hava durumu eslesmesi icin sehir. Resort Hotel -> Faro, City Hotel -> Lisbon.
        data_tests:
          - not_null
      - name: arrival_date
        description: Planlanan varis tarihi.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: is_canceled
        description: Hedef degisken. 1 = rezervasyon iptal edildi, 0 = edilmedi.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_duplicate
        description: >
          Esma'nin ara katmanindan gelen kopya isareti. Ayni bilgilere sahip ikinci ve
          sonraki satirlar true. Veri setinde rezervasyon numarasi olmadigi icin bunlar
          gercek ayri rezervasyonlar da olabilir; bu yuzden silinmedi.
        data_tests:
          - not_null
      - name: total_nights
        description: Toplam konaklama gecesi (hafta sonu + hafta ici).
      - name: total_guests
        description: Toplam misafir (yetiskin + cocuk + bebek).
      - name: is_room_changed
        description: Verilen oda tipi, rezerve edilenden farkli mi.
      - name: adr
        description: Ortalama gecelik fiyat (Average Daily Rate), Euro.
      - name: booking_revenue
        description: Rezervasyonun toplam tutari = adr x total_nights.
        data_tests:
          - not_null
      - name: realized_revenue
        description: Iptal edilmeyen rezervasyonlarda gerceklesen gelir, iptallerde 0.
      - name: lost_revenue
        description: Iptal edilen rezervasyonlarda kaybedilen gelir, digerlerinde 0.
      - name: temp_mean_c
        description: >
          Varis gunu ortalama sicaklik (C), Open-Meteo. DIKKAT: rezervasyon yapilirken bu
          bilgi henuz bilinmez; Bolum 2'de modelde kullanilacaksa bu sinirlilik belirtilmeli.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: precipitation_mm
        description: Varis gunu toplam yagis (mm).
      - name: is_rainy_day
        description: Varis gunu yagis 1 mm veya ustu ise true (meteorolojide yagisli gun esigi).
      - name: temp_band
        description: Varis gunu ortalama sicaklik araligi (15 alti, 15-20, 20-25, 25 ve ustu).
      - name: reservation_status
        description: >
          Rezervasyonun son durumu (Canceled, No-Show, Check-Out). DIKKAT: iptal
          bilgisini dogrudan icerir, modelde girdi olarak KULLANILMAMALIDIR (veri sizintisi).
      - name: reservation_status_date
        description: Son durumun tarihi. reservation_status ile ayni sebeple modelde kullanilmaz.

  - name: dim_date
    description: Her satir bir takvim gunu. Dashboard'daki tarih filtreleri icin.
    columns:
      - name: date_day
        description: Takvim gunu (anahtar).
        data_tests:
          - unique
          - not_null
      - name: month_name_tr
        description: Turkce ay adi.
      - name: weekday_tr
        description: Turkce gun adi.
      - name: is_weekend
        description: Cumartesi veya Pazar ise true.
      - name: season
        description: Mevsim (Kis, Ilkbahar, Yaz, Sonbahar).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Kış', 'İlkbahar', 'Yaz', 'Sonbahar']

  - name: mart_monthly_cancellations
    description: Her satir bir otel ve bir varis ayi. KPI kartlari ve aylik trend icin ozet tablo.
    columns:
      - name: hotel
        data_tests:
          - not_null
      - name: month_start
        description: Ayin ilk gunu.
        data_tests:
          - not_null
      - name: total_bookings
        description: O ay o otele gelen rezervasyon sayisi.
      - name: canceled_bookings
        description: Bunlardan iptal edilenler.
      - name: cancel_rate
        description: Iptal orani = canceled_bookings / total_bookings (0 ile 1 arasi).
      - name: avg_adr
        description: Ortalama gecelik fiyat.
      - name: realized_revenue
        description: Gerceklesen toplam gelir.
      - name: lost_revenue
        description: Iptaller nedeniyle kaybedilen toplam gelir.

  - name: mart_weather_cancellations
    description: >
      Her satir bir otel + yagis durumu + sicaklik araligi. Hava durumunun iptal
      oranina etkisini gostermek icin dashboard ozeti.
    columns:
      - name: hotel
        data_tests:
          - not_null
      - name: is_rainy_day
        description: Varis gunu yagisli mi.
      - name: temp_band
        description: Sicaklik araligi.
      - name: total_bookings
        description: Bu gruptaki rezervasyon sayisi.
      - name: cancel_rate
        description: Iptal orani (0-1).